[project]
name = "plant-disease-fastapi"
version = "1.0.0"
description = "Plant Disease Detection – FastAPI inference service"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pillow==10.4.0",
    "numpy==1.26.4",
    "tensorflow==2.17.0",
]

[tool.uv]
# Keep a lockfile so every developer / CI run gets identical packages.
# Generate / update it with:  uv lock
